  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

{evCols}}; border-bottom: 1px solid var(--line)\">\n<sc-for list=\"{{evHead}}\" as=\"h\" hint-placeholder-count=\"9\">\n<div role=\"columnheader\" aria-sort=\"{{h.aria}}\"><button type=\"button\" class=\"hov\" sc-camel-on-click=\"{{h.sort}}\" style=\"width: 100%; min-height: 40px; padding: 0 14px; border: 0; background: {{h.bg}}; text-align: {{h.align}}; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: {{h.ink}}; white-space: nowrap; cursor: pointer\">{{h.label}}<\u002Fbutton><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-for list=\"{{evRows}}\" as=\"e\" hint-placeholder-count=\"24\">\n<div role=\"row\" class=\"row\" style=\"display: grid; grid-template-columns: {{e.cols}}; border-top: {{e.edge}}; white-space: nowrap; font-family: var(--mono)\">\n<div role=\"cell\" style=\"padding: 7px 14px\"><span style=\"display: inline-flex; align-items: center; gap: 8px\"><span style=\"width: 10px; height: 10px; background: {{e.color}}\"><\u002Fspan>{{e.season}}<\u002Fspan><\u002Fdiv>\n<div role=\"cell\" style=\"padding: 7px 14px; text-align: right\">{{e.id}}<\u002Fdiv>\n<div role=\"cell\" style=\"padding: 7px 14px; text-align: right\">{{e.t}}<\u002Fdiv>\n<div role=\"cell\" style=\"padding: 7px 14px; text-align: right; text-transform: uppercase\">{{e.probes}}<\u002Fdiv>\n<div role=\"cell\" style=\"padding: 7px 14px; text-align: right\">{{e.dur}}<\u002Fdiv>\n<div role=\"cell\" style=\"padding: 7px 14px; text-align: right\">{{e.n1}}<\u002Fdiv>\n<div role=\"cell\" style=\"padding: 7px 14px; text-align: right\">{{e.n2}}<\u002Fdiv>\n<div role=\"cell\" style=\"padding: 7px 14px; text-align: right\">{{e.eb}}<\u002Fdiv>\n<div role=\"cell\" style=\"padding: 7px 14px; text-align: right\">{{e.prob}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--ink-3)\">__FOOTER__<\u002Ffooter>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{tipOn}}\" hint-placeholder-val=\"{{false}}\">\n<div role=\"tooltip\" style=\"position: fixed; left: {{tipX}}px; top: {{tipY}}px; z-index: 20; pointer-events: none; max-width: 300px; padding: 10px 12px; background: var(--page); color: var(--ink); border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; line-height: 1.55\">\n<sc-for list=\"{{tipLines}}\" as=\"l\" hint-placeholder-count=\"3\">\n<div style=\"font-weight: {{l.w}}\">{{l.text}}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:4200}}\">\nclass Component extends DCLogic {\n  state = { off: [], band: 'share', sortKey: 'n1', sortDir: -1, tip: null, ring: null, focus: null, dscale: 'shared' };\n\n  static D = __DATA__;\n\n  fmtN(v, d) {\n    d = d || 0;\n    return v == null ? '–' : Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });\n  }\n  pctS(v) { return v == null ? '–' : (100 * v).toFixed(0) + '%'; }\n  niceTicks(min, max, n) {\n    const span = max - min || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));\n    const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;\n    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];\n    for (let v = lo; v <= hi + step / 2; v += step) t.push(+v.toFixed(6));\n    return t;\n  }\n  linScale(d0, d1, r0, r1) { return v => r0 + (v - d0) / ((d1 - d0) || 1) * (r1 - r0); }\n  openTip(lines, e, ring) {\n    const w = 310, h = 18 * lines.length + 24;\n    let x = e.clientX + 14, y = e.clientY + 14;\n    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;\n    if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;\n    this.setState({ tip: { x: Math.round(x), y: Math.round(y), lines: lines.map((t, i) => ({ text: t, w: i === 0 ? 700 : 400 })) }, ring: ring || null });\n  }\n  shapePath(k, cx, cy) {\n    const f = v => Math.round(v * 100) / 100;\n    if (k % 3 === 1) return 'M' + f(cx - 4.5) + ',' + f(cy - 4.5) + ' h9 v9 h-9 Z';\n    if (k % 3 === 2) return 'M' + f(cx) + ',' + f(cy - 6) + ' L' + f(cx + 5.6) + ',' + f(cy + 4) + ' L' + f(cx - 5.6) + ',' + f(cy + 4) + ' Z';\n    return 'M' + f(cx - 5) + ',' + f(cy) + ' a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 Z';\n  }\n\n  scatter(V, S, ky, name) {\n    const r2 = v => Math.round(v * 100) / 100;\n    const all = S.flatMap(s => s.points);\n    const W = 520, H = 440, L = 48, R = 12, T = 12, B = 40;\n    const xt = this.niceTicks(Math.min(...all.map(p => p.x)), Math.max(...all.map(p => p.x)), 5);\n    const yt = this.niceTicks(Math.min(...all.map(p => p[ky])), Math.max(...all.map(p => p[ky])), 5);\n    const x = this.linScale(xt[0], xt[xt.length - 1], L, W - R), y = this.linScale(yt[0], yt[yt.length - 1], H - B, T);\n    const focus = this.state.focus;\n    const pts = [];\n    // Largest season first so the small ones are drawn on top.\n    V.slice().sort((a, b) => b.points.length - a.points.length).forEach(s => {\n      const k = S.indexOf(s), color = 'var(--s' + k + ')';\n      const op = focus && focus !== s.season ? 0.12 : 1;\n      s.points.forEach(p => {\n        const cx = r2(x(p.x)), cy = r2(y(p[ky]));\n        const lines = [\n          p.id,\n          p.t + ' UT · ' + s.season,\n          'X ' + p.x.toFixed(1) + ' · Y ' + p.y.toFixed(1) + ' · Z ' + p.z.toFixed(1) + ' Re',\n          'E_b ' + this.fmtN(p.eb) + ' eV · Te ' + this.fmtN(p.te) + ' eV · beta ' + this.fmtN(p.beta, 4),\n          p.n + ' samples · ' + this.fmtN(p.dur) + ' s · prob ' + this.fmtN(p.prob, 3)\n        ];\n        pts.push({ d: this.shapePath(k, cx, cy), cx, cy, color, op, enter: e => this.openTip(lines, e, { chart: name, x: cx, y: cy }) });\n      });\n    });\n    const ring = this.state.ring && this.state.ring.chart === name ? this.state.ring : null;\n    const yc = (T + H - B) / 2;\n    return {\n      view: '0 0 ' + W + ' ' + H,\n      xTicks: xt.map(t => ({ x: r2(x(t)), y1: T, y2: H - B, ty: H - B + 17, label: String(t) })),\n      yTicks: yt.map(t => ({ y: r2(y(t)), x1: L, x2: W - R, tx: L - 6, ty: r2(y(t) + 4), label: String(t) })),\n      fx: L, fy: T, fw: W - R - L, fh: H - B - T,\n      xlx: (L + W - R) / 2, xly: H - 2, ylc: yc, yrot: 'rotate(-90 12 ' + yc + ')',\n      pts,\n      ringOn: !!ring, ringX: ring ? ring.x : 0, ringY: ring ? ring.y : 0\n    };\n  }\n\n  renderVals() {\n    const D = Component.D, S = D.seasons, st = this.state;\n    const r2 = v => Math.round(v * 100) / 100;\n    const fmt = (v, d) => this.fmtN(v, d), pct = v => this.pctS(v);\n    const off = new Set(st.off);\n    const V = S.filter(s => !off.has(s.season));\n    const colorOf = s => 'var(--s' + S.indexOf(s) + ')';\n    const closeTip = () => this.setState({ tip: null, ring: null });\n    const theme = this.props.theme ?? 'light';\n    const edge = i => i === 0 ? '0' : '1px solid var(--soft)';\n\n    const chips = S.map((s, i) => {\n      const on = !off.has(s.season);\n      return {\n        season: s.season, pressed: on ? 'true' : 'false',\n        bg: on ? 'var(--hl)' : 'transparent', ink: on ? 'var(--ink)' : 'var(--ink-3)',\n        sw: on ? 'var(--s' + i + ')' : 'transparent', ring: 'var(--s' + i + ')',\n        toggle: () => {\n          const o = new Set(this.state.off);\n          if (o.has(s.season)) o.delete(s.season);\n          else if (S.length - o.size > 1) o.add(s.season);\n          this.setState({ off: Array.from(o) });\n        }\n      };\n    });\n    const focus = st.focus && V.some(s => s.season === st.focus) ? st.focus : null;\n    const legend = V.map(s => ({\n      season: s.season, color: colorOf(s), shape: this.shapePath(S.indexOf(s), 0, 0),\n      aria: 'Highlight ' + s.season,\n      focus: () => this.setState({ focus: s.season }),\n      blur: () => this.setState({ focus: null })\n    }));\n    const dimFor = (season, key, chart) => {\n      if (focus && focus !== season) return 0.25;\n      const r = st.ring;\n      if (r && r.chart === chart && r.key !== key) return 0.45;\n      return 1;\n    };\n\n    const cmpDefs = [\n      ['Angle-resolved hours', s => fmt(s.hours)], ['Intervals processed', s => fmt(s.processed) + ' of ' + fmt(s.intervals)],\n      ['Episodes', s => fmt(s.episodes)], ['Pass the scope gates', s => fmt(s.gated)],\n      ['Tier 1', s => fmt(s.t1)], ['Tier 2', s => fmt(s.t2)],\n      ['Tier 1 per 100 h', s => fmt(s.rate, 2)], ['Tier-1 beam time, h', s => fmt(s.beam_h, 2)],\n      ['Days with tier 1', s => fmt(s.days)], ['Beam time on 3 busiest days', s => pct(s.top3_share)],\n      ['Median duration, s', s => fmt(s.med_dur)], ['Median beam energy, eV', s => fmt(s.med_eb)],\n      ['Median electron temperature, eV', s => fmt(s.med_te)], ['Median plasma beta', s => fmt(s.med_beta, 4)],\n      ['Median model probability', s => fmt(s.med_prob, 3)],\n      ['Parallel / anti-parallel', s => s.par + ' / ' + s.anti],\n      ['Tier 1 by probe', s => Object.entries(s.probes).map(([p, n]) => p + ' ' + n).join(' · ')],\n      ['Events with tier 1', s => fmt(s.events)], ['Multi-probe events', s => fmt(s.multi)],\n      ['Tier 1 in multi-probe events', s => pct(s.multi_frac)]\n    ];\n    const cmpCols = 'minmax(260px, 2fr) repeat(' + V.length + ', minmax(120px, 1fr))';\n    const cmpHead = V.map(s => ({ season: s.season, color: colorOf(s) }));\n    const cmpRows = cmpDefs.map(([name, f], i) => ({ name, cols: cmpCols, edge: edge(i), cells: V.map(s => ({ v: f(s) })) }));\n\n    // Tier-1 rate\n    const RW = 500, rowH = 40, RL = 64, RR = 56, RT = 6, RH = RT + V.length * rowH + 46;\n    const rmax = Math.max(...V.map(s => s.rate), 0.1), rt = this.niceTicks(0, rmax, 4);\n    const rx = this.linScale(0, rt[rt.length - 1], RL, RW - RR);\n    const plotBottom = RT + V.length * rowH + 4;\n    const rate = {\n      view: '0 0 ' + RW + ' ' + RH,\n      axisX: RL, axisY1: RT, axisY2: plotBottom,\n      titleX: r2((RL + RW - RR) / 2), titleY: RH - 2,\n      ytC: r2((RT + RT + V.length * rowH + 4) / 2), ytRot: 'rotate(-90 12 ' + r2((RT + RT + V.length * rowH + 4) / 2) + ')',\n      ticks: rt.map(t => ({ x: r2(rx(t)), y1: RT, y2: plotBottom, ty: plotBottom + 17, label: String(t) })),\n      bars: V.map((s, i) => {\n        const y = RT + i * rowH + 9, w = r2(Math.max(rx(s.rate) - RL, 1));\n        const lines = [s.season, fmt(s.rate, 2) + ' per 100 h', s.t1 + ' tier 1 in ' + fmt(s.hours) + ' h'];\n        return {\n          season: s.season, lx: RL - 10, ty: y + 16, vx: r2(RL + w + 8), value: fmt(s.rate, 2), color: colorOf(s),\n          x: RL, y, w, h: 24, op: dimFor(s.season, s.season, 'rate'),\n          hx: RL, hy: y - 8, hw: RW - RL - RR + 40, hh: rowH,\n          enter: e => this.openTip(lines, e, { chart: 'rate', key: s.season })\n        };\n      })\n    };\n\n    // Beam energy bands\n    const Bn = D.bands, share = st.band === 'share';\n    const BW = 500, BH = 290, BL = 62, BR = 8, BT = 22, BB = 52, GAP = 2;\n    const val = (s, i) => share ? 100 * s.bands[i] / Math.max(s.t1, 1) : s.bands[i];\n    const bmax = Math.max(...V.flatMap(s => Bn.map((_, i) => val(s, i))), 1), bt = this.niceTicks(0, bmax, 4);\n    const by = this.linScale(0, bt[bt.length - 1], BH - BB, BT), gw = (BW - BL - BR) / Bn.length;\n    const bw = Math.min(24, (gw - 14) / V.length - GAP);\n    const bars = [];\n    let peak = null;\n    Bn.forEach((b, i) => {\n      const gx = BL + i * gw + (gw - V.length * (bw + GAP) + GAP) / 2;\n      V.forEach((s, j) => {\n        const v = val(s, i), top = by(v), h = Math.max(BH - BB - top, v > 0 ? 2 : 0), x0 = gx + j * (bw + GAP), key = s.season + ':' + i;\n        const lines = [s.season + ' · ' + b + ' eV', s.bands[i] + ' tier-1 episodes', (100 * s.bands[i] / Math.max(s.t1, 1)).toFixed(0) + '% of the season'];\n        if (st.ring && st.ring.chart === 'band' && st.ring.key === key) peak = { x: r2(x0 + bw / 2), y: r2(BH - BB - h - 6), label: share ? v.toFixed(0) + '%' : String(v) };\n        bars.push({\n          color: colorOf(s), x: r2(x0), y: r2(BH - BB - h), w: r2(bw), h: r2(h), op: dimFor(s.season, key, 'band'),\n          hx: r2(x0 - GAP / 2), hy: BT, hw: r2(bw + GAP), hh: BH - BB - BT,\n          enter: e => this.openTip(lines, e, { chart: 'band', key })\n        });\n      });\n    });\n    const byc = r2((BT + BH - BB) / 2);\n    const band = {\n      peakOn: !!peak, peakX: peak ? peak.x : 0, peakY: peak ? peak.y : 0, peakLabel: peak ? peak.label : '',\n      view: '0 0 ' + BW + ' ' + BH,\n      baseX1: BL, baseX2: BW - BR, baseY: BH - BB,\n      xtX: r2((BL + BW - BR) / 2), xtY: BH - 4,\n      ytC: byc, ytRot: 'rotate(-90 12 ' + byc + ')', yTitle: share ? 'SHARE OF SEASON' : 'EPISODES',\n      ticks: bt.map(t => ({ x1: BL, x2: BW - BR, y: r2(by(t)), tx: BL - 8, ty: r2(by(t) + 4), label: t + (share ? '%' : '') })),\n      groups: Bn.map((b, i) => ({ x: r2(BL + i * gw + gw / 2), y: BH - BB + 18, label: b })),\n      bars,\n      sharePressed: share ? 'true' : 'false', countPressed: share ? 'false' : 'true',\n      shareBg: share ? 'var(--hl)' : 'var(--page)', countBg: share ? 'var(--page)' : 'var(--hl)',\n      pickShare: () => this.setState({ band: 'share' }), pickCount: () => this.setState({ band: 'count' })\n    };\n\n    // Positions\n    const xy = this.scatter(V, S, 'y', 'xy');\n    const xz = this.scatter(V, S, 'z', 'xz');\n\n    // Daily activity\n    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];\n    const sharedScale = st.dscale !== 'own';\n    const dmaxAll = Math.max(...V.flatMap(s => s.daily.map(d => d.t1)), 1);\n    const daily = V.map((s, si) => {\n      const last = si === V.length - 1;\n      const W = 1076, L = 62, R = 8, T = 8, B = 30, H = 150 + (last ? 20 : 0), plotB = H - B - (last ? 20 : 0);\n      const n = s.daily.length, bw2 = (W - L - R) / Math.max(n, 1);\n      const smax = Math.max(...s.daily.map(d => d.t1), 1);\n      const dt = this.niceTicks(0, sharedScale ? dmaxAll : smax, 3);\n      const y = this.linScale(0, dt[dt.length - 1], plotB, T), gap = Math.min(2, bw2 * 0.25), color = colorOf(s);\n      const barsD = [], hits = [], xTicks = [];\n      let pk = null;\n      const r = st.ring && st.ring.chart === 'd' + s.season ? st.ring : null;\n      s.daily.forEach((d, i) => {\n        const x0 = L + i * bw2, day = d.d.slice(8, 10);\n        if (day === '01' || day === '15') {\n          const xm = r2(x0 + bw2 / 2);\n          xTicks.push({ x: xm, y1: plotB, y2: plotB + 5, ty: plotB + 19, label: MON[+d.d.slice(5, 7) - 1] + ' ' + (+day) });\n        }\n        if (d.t1) {\n          const top = Math.min(y(d.t1), plotB - 2);\n          barsD.push({ x: r2(x0 + gap / 2), y: r2(top), w: r2(Math.max(bw2 - gap, 1)), h: r2(plotB - top), color });\n          if (!pk || d.t1 > pk.v) pk = { v: d.t1, x: x0 + bw2 / 2, y: top };\n        }\n        const lines = [d.d + ' · ' + s.season, 'tier 1 ' + d.t1 + ' · tier 2 ' + d.t2];\n        hits.push({ x: r2(x0), y: T, w: r2(bw2), h: plotB - T, enter: e => this.openTip(lines, e, { chart: 'd' + s.season, i }) });\n      });\n      const nearRight = pk && pk.x > W - 120;\n      const yc = r2((T + plotB) / 2);\n      return {\n        season: s.season, color, last, edge: si === 0 ? '0' : '1px solid var(--soft)',\n        view: '0 0 ' + W + ' ' + H,\n        aria: 'Tier-1 episodes per day, ' + s.season,\n        ticks: dt.map(t => ({ x1: L, x2: W - R, y: r2(y(t)), tx: L - 8, ty: r2(y(t) + 4), label: String(t) })),\n        xTicks,\n        sx: L, ex: W - R, baseY: plotB,\n        ytC: yc, ytRot: 'rotate(-90 14 ' + yc + ')',\n        xtX: r2((L + W - R) / 2), xtY: H - 2,\n        peakOn: !!pk, peakX: pk ? r2(nearRight ? pk.x - 8 : pk.x + 8) : 0, peakY: pk ? r2(Math.max(pk.y + 10, T + 10)) : 0,\n        peakAnchor: nearRight ? 'end' : 'start', peakLabel: pk ? String(pk.v) : '',\n        hlOn: !!r, hlX: r ? r2(L + r.i * bw2) : 0, hlY: T, hlW: r2(bw2), hlH: plotB - T,\n        bars: barsD, hits\n      };\n    });\n    const dscale = {\n      sharedPressed: sharedScale ? 'true' : 'false', ownPressed: sharedScale ? 'false' : 'true',\n      sharedBg: sharedScale ? 'var(--hl)' : 'var(--page)', ownBg: sharedScale ? 'var(--page)' : 'var(--hl)',\n      pickShared: () => this.setState({ dscale: 'shared' }), pickOwn: () => this.setState({ dscale: 'own' })\n    };\n\n    // Validation\n    const valRows = V.map((s, i) => {\n      const v = s.val, r = v.t1 ? v.t1_neg / v.t1 : null;\n      return {\n        season: s.season, color: colorOf(s), edge: edge(i),\n        decks: (v.decks.join(', ') || 'none') + (v.roles.length ? ' (' + v.roles.join(', ') + ')' : ''),\n        decided: String(v.decided),\n        neg: v.t1_neg + ' of ' + v.t1 + (r == null ? '' : ' · ' + pct(r)),\n        negInk: r != null && r > 0.2 ? 'var(--bad)' : 'var(--ink)',\n        ci: v.t1 ? pct(v.ci[0]) + ' to ' + pct(v.ci[1]) : '–',\n        p1: v.pos_t1 + ' of ' + v.pos, p12: v.pos_t12 + ' of ' + v.pos\n      };\n    });\n\n    // Events\n    const evDefs = [['season', 'Season'], ['id', 'Event'], ['t', 'Start, UT'], ['probes', 'Probes'], ['dur', 'Minutes'], ['n1', 'Tier 1'], ['n2', 'Tier 2'], ['eb', 'E_b range, eV'], ['prob', 'Max prob']];\n    const evCols = '100px minmax(220px, 1.6fr) 150px 90px 100px 90px 90px 140px 110px';\n    const k = st.sortKey, dir = st.sortDir;\n    const evHead = evDefs.map(([key, name], i) => ({\n      label: name + (key === k ? (dir > 0 ? ' ↑' : ' ↓') : ''),\n      aria: key === k ? (dir > 0 ? 'ascending' : 'descending') : 'none',\n      align: i === 0 ? 'left' : 'right',\n      ink: key === k ? 'var(--ink)' : 'var(--ink-3)',\n      bg: key === k ? 'var(--hl)' : 'transparent',\n      sort: () => {\n        const cur = this.state;\n        const nd = cur.sortKey === key ? -cur.sortDir : (key === 'season' || key === 'id' || key === 't' ? 1 : -1);\n        this.setState({ sortKey: key, sortDir: nd });\n      }\n    }));\n    const evRows = V.flatMap(s => s.top_events.map(e => Object.assign({}, e, { season: s.season, color: colorOf(s) })))\n      .sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * dir)\n      .map((e, i) => ({\n        cols: evCols, edge: edge(i), season: e.season, color: e.color, id: e.id, t: e.t, probes: e.probes,\n        dur: fmt(e.dur, 1), n1: String(e.n1), n2: String(e.n2), eb: e.eb, prob: fmt(e.prob, 3)\n      }));\n\n    const tip = st.tip;\n    return {\n      themeClass: 't-' + theme,\n      chips, legend, cmpCols, cmpHead, cmpRows, rate, band, xy, xz, daily, dscale, valRows,\n      evCols, evHead, evRows,\n      closeTip,\n      tipOn: !!tip, tipX: tip ? tip.x : 0, tipY: tip ? tip.y : 0, tipLines: tip ? tip.lines : []\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
